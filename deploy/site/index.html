<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101828">
  <title>Welcome | shaafsaad.com</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center;
      background: radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.25), transparent 28rem), radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.18), transparent 25rem), #101828;
      color: #f8fafc;
    }
    main {
      width: min(620px, calc(100% - 40px)); padding: 56px 44px; text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 24px;
      background: rgba(15, 23, 42, 0.72); box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35); backdrop-filter: blur(14px);
    }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 24px; display: grid; place-items: center;
      border-radius: 18px; background: linear-gradient(135deg, #818cf8, #38bdf8);
      font-size: 28px; font-weight: 800; box-shadow: 0 12px 32px rgba(56, 189, 248, 0.22);
    }
    h1 { margin: 0 0 12px; font-size: clamp(38px, 8vw, 64px); letter-spacing: -0.045em; }
    p { margin: 0; color: #cbd5e1; font-size: 18px; line-height: 1.7; }
    .status { margin-top: 28px; display: inline-flex; align-items: center; gap: 9px; color: #a7f3d0; font-size: 14px; font-weight: 700; }
    .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 16px #34d399; }
    .timegate-link {
      display: inline-flex; margin-top: 18px; padding: 12px 18px; border: 1px solid rgba(0, 255, 235, .7);
      border-radius: 12px; color: #efffff; text-decoration: none; font-weight: 750;
      background: rgba(0, 255, 235, .07); box-shadow: 0 0 18px rgba(0, 255, 235, .14);
    }
    .timegate-link:hover { border-color: #ffbe50; color: #ffbe50; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">SS</div>
    <h1>Welcome</h1>
    <p>This is <strong>shaafsaad.com</strong>—a new home for ideas, projects, and more.</p>
    <div class="status">Website is online</div>
    <br>
    <a class="timegate-link" href="/timegate/">Open TimeGate Dashboard</a>
  </main>
</body>
</html>
