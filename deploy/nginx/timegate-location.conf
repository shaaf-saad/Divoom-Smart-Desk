# Include these locations inside the shaafsaad.com HTTPS/server block.
location = /timegate { return 301 /timegate/; }

location = /_timegate_auth {
    internal;
    proxy_pass http://127.0.0.1:3000/api/v1/auths/;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}

location @timegate_login {
    return 302 /ai/?redirect=%2Ftimegate%2F;
}

location /timegate/ {
    auth_request /_timegate_auth;
    error_page 401 = @timegate_login;
    proxy_pass http://127.0.0.1:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
}
